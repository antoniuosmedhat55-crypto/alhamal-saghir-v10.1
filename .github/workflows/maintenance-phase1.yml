name: Maintenance phase 1 checks

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - feature/maintenance-workflows-phase1

permissions:
  contents: read

jobs:
  baseline:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check server syntax
        run: node --check server.js
      - name: Run existing security regression tests
        run: npm run test:security
      - name: Verify compressed source can be extracted
        run: npm run source:extract
